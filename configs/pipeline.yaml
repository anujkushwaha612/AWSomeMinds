# Every number the pipeline uses lives here (plan.md Step 0).
# Paths may be local or s3:// URIs. Override the whole file with BER_CONFIG=<path>.

# Raw challenge data. Local copy by default; on SageMaker either sync it locally or
# point at the read-only bucket: s3://awsomeminds-dataset-532749777349/dataset
data_root: data/dataset

# Where every stage writes its outputs (parquet caches, folds, scores, submissions).
# Local disk for one teammate; an s3:// URI for the other (same code either way).
artifacts_root: artifacts

seed: 2026

validation:
  n_folds: 5            # entity-level cross-fitting on the full train universe
  report_fold: 0        # decision params tuned on the other folds, reported here
  k_buckets: [0, 1, 2, 3, 4, 5, 6]   # last bucket means ">= 6"

blocking:
  # char n-gram TF-IDF, fitted per country on that country's S1+S2+S3 texts
  ngram: [3, 3]
  min_df: 2
  max_df: 0.10          # drop n-grams in >10% of records (pvt/ltd/inc): speed, little signal
  views: [NA, A, N]     # NA = name+address, A = address only, N = name only, T = translit [EXP]
  k_forward: 50         # S1 -> top-k per source (stored; audit picks the K actually used)
  k_reverse: 10         # S2/S3 -> top-k S1
  query_chunk: 20000
  n_threads: 0          # 0 = all cores

baseline:
  # retrieval (experiment E0b): word 1+2-gram TF-IDF on name+address, record-side
  k_rec: 3              # top-k S1 per S2/S3 record (candidate set = k_rec x records)
  max_df: 0.01          # block purging: drop n-grams in >1% of the country's records
  min_score: 0.0        # cosine floor for a candidate
  workers: 8            # hashing processes (Python-level work); see experiments.md for the sweep
  chunk: 50000          # rows per hashing / search chunk
  window: 16            # max hashed chunks in flight (bounds memory: ~2 x workers)
  feature_chunk: 500000 # candidate pairs per string-feature chunk
  predict_batch: 1000000  # feature rows per parquet read / prediction batch
  # model
  train_frac: 0.3       # share of training-fold entities (all their pairs) used per fold model
  lgb:
    learning_rate: 0.1
    num_leaves: 63
    min_data_in_leaf: 200
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    num_rounds: 400
    early_stopping: 30
    force_col_wise: true    # no row-wise copy of the binned data (memory); no effect on accuracy
  grid: [0.10, 0.95, 0.05]   # T_first / T_rest search grid: [low, high, step]

v5:
  # strategy_v5.md: A (bi-encoder) + B (union GBDT, stage 2, pruning) + C (LB gap).
  # Every value below is justified by a measurement in experiments.md E4 (or marked [L]/[J]).
  tfidf_run: baseline         # existing TF-IDF candidates/features in artifacts/baseline
  encoder_folds: [3, 4]       # leakage rule: encoder trains only on these entities
  gbdt_folds: [0, 1, 2]       # GBDT cross-fitted here; decision tuned on 1-2, reported on 0
  report_fold: 0
  neural:
    model: intfloat/multilingual-e5-base   # MIT per model card; xlm-r tokenizer covers all Indic blocks
    max_len: 64               # E4: p99 tokens <= 56 everywhere, > 64 in < 0.05% of texts
    n_pairs: 0                # 0 = all folds-3/4 positives (E4: 3.06M); set lower if the probe is slow
    batch_size: 256           # [L] in-batch negatives: larger is better up to memory
    same_country_batches: true  # E4: 36-44% of parents share their name with another S1 -> hard in-batch
    lr: 2.0e-5                # [L] standard for fine-tuning e5-base
    warmup: 0.05
    epochs: 1                 # 3M pairs; one pass is enough to fit the generator's noise [J]
    scale: 20.0               # [L] e5 / MultipleNegativesRanking temperature 0.05
    eval_records: 20000       # per country, fold-0 records: recall gate
    encode_batch: 512
    k_rec: 3                  # E4: TF-IDF finds 97-98% of found parents at rank 0; ranks 1-2 add 2-3 pp
    k_s1: 5                   # E4: S1-side list per source; per-source true matches <= 5 for 100% (S2) / 99.9% (S3)
    tile_gb: 6.0              # similarity tile size on the GPU
    gate_k: 5                 # recall gate: report R@1 / R@3 / R@gate_k
    weight_decay: 0.01        # [L]
    grad_clip: 1.0            # [L]
    log_every: 100            # training log interval (steps)
    checkpoint_every: 2000    # resumable checkpoint interval (steps)
    train_budget_h: 3.0       # env_check suggests fewer pairs if training would exceed this
  drop_encoder_records: false # true = remove encoder-seen records from the train GBDT universe (leakage check fallback)
  early_stop_share: 0.1       # share of training ENTITIES held out for LightGBM early stopping
  prune_tau: 0.003            # E4: 14.0 -> 5.05 candidates/S1 at oracle loss 0.00004
  train_frac: 1.0             # share of gbdt-fold entities per fold model (60% of all entities in total)
  max_train_rows: 20000000    # memory cap for stage 1 on 15.7 GB RAM (~3 GB float32 at 37 features)
  lgb:
    learning_rate: 0.05       # E4: early stopping hit at 114-217 trees at lr 0.1 -> signal-limited; lower lr, more rounds [L]
    num_leaves: 127
    min_data_in_leaf: 200
    feature_fraction: 0.9
    bagging_fraction: 0.8
    bagging_freq: 1
    num_rounds: 3000
    early_stopping: 50
    force_col_wise: true
  grid: [0.10, 0.95, 0.05]
  stress_fraction: 0.19       # E4: S1 share to remove so train density = test density (India 0.196, US 0.188)

bootstrap:
  n_resamples: 1000
  alpha: 0.05
  materiality: 0.002    # [J] minimum Δ macro-F0.5 worth keeping a component for
